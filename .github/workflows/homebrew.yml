name: Bump Homebrew formula

# Optional and manual. Homebrew formulas live in a separate *tap* repository.
# Before this can run you need:
#   1. A tap repo, e.g. https://github.com/Caertos/homebrew-tap
#      containing Formula/opencode-go-rolling-usage.rb (see packaging/homebrew/).
#   2. A repository secret HOMEBREW_TAP_TOKEN: a PAT with `repo` scope on the tap.
#   3. The version already published to npm (run the Release workflow first).
#
# Run it from the Actions tab -> "Bump Homebrew formula" -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already published to npm (e.g. 0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  bump:
    name: update tap formula
    runs-on: ubuntu-latest
    env:
      TAP_REPO: Caertos/homebrew-tap
      PKG: opencode-go-rolling-usage
      FORMULA: Formula/opencode-go-rolling-usage.rb
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Require HOMEBREW_TAP_TOKEN
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::error::Set the HOMEBREW_TAP_TOKEN repository secret and create ${TAP_REPO} first."
            exit 1
          fi

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula url + sha256
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          URL="https://registry.npmjs.org/${PKG}/-/${PKG}-${VERSION}.tgz"
          SHA="$(curl -fsSL "${URL}" | shasum -a 256 | awk '{print $1}')"
          FILE="tap/${FORMULA}"
          if [ ! -f "${FILE}" ]; then
            echo "::error::${FORMULA} not found in ${TAP_REPO}"
            exit 1
          fi
          sed -i -E "s#^(  url )\".*\"#\1\"${URL}\"#" "${FILE}"
          sed -i -E "s#^(  sha256 )\".*\"#\1\"${SHA}\"#" "${FILE}"
          echo "Bumped ${FORMULA} to ${VERSION} (sha256 ${SHA})"

      - name: Commit and open PR in the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="bump-${PKG}-${VERSION}"
          git checkout -b "${BRANCH}"
          git add "${FORMULA}"
          git commit -m "opencode-go-rolling-usage ${VERSION}"
          git push origin "${BRANCH}"
          gh pr create \
            --repo "${TAP_REPO}" \
            --title "opencode-go-rolling-usage ${VERSION}" \
            --body "Automated Homebrew formula bump to ${VERSION}."
